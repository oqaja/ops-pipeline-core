name: NSP IG - Backfill Post Insights (Self-Chaining)
# Trigger SEKALI lewat "Run workflow". Tiap batch nge-trigger batch berikutnya sendiri
# sampai flag DONE di tab _State ke-set, lalu rantai berhenti total.
# Reset: hapus baris "Instagram Nsp::BACKFILL_DONE" di tab _State.
on:
  workflow_dispatch:
concurrency:
  group: nsp-ig-insights
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nsp-instagram
    permissions:
      contents: read
      actions: write
    env:
      KALENDER_SPREADSHEET_ID: ${{ vars.KALENDER_SPREADSHEET_ID }}
      INSIGHTS_SPREADSHEET_ID: ${{ vars.INSIGHTS_SPREADSHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      DOCS_MASTER_ID: ${{ vars.DOCS_MASTER_ID }}
      NSP_IG_BUSINESS_ACCOUNT_ID: ${{ vars.NSP_IG_BUSINESS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Backfill batch
        id: backfill
        run: npm run backfill-post-insights
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.SP_IG_GOOGLE_SERVICE_ACCOUNT_KEY }}
          NSP_IG_ACCESS_TOKEN: ${{ secrets.NSP_IG_ACCESS_TOKEN }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.SP_IG_GOOGLE_DRIVE_API_KEY }}
      - name: Lanjut batch berikutnya
        if: steps.backfill.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run nsp-ig-backfill.yml
