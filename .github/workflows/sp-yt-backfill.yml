name: SP YouTube - Backfill Post Insights (Self-Chaining)
# Trigger SEKALI lewat "Run workflow". Tiap batch nge-trigger batch berikutnya sendiri
# sampai flag DONE di tab _State ke-set, lalu rantai berhenti total.
# Reset: hapus baris "SP_YT_BACKFILL_DONE" di tab _State.
on:
  workflow_dispatch:
concurrency:
  group: sp-yt-insights
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sp-youtube
    permissions:
      contents: read
      actions: write
    env:
      KALENDER_SPREADSHEET_ID: ${{ vars.KALENDER_SPREADSHEET_ID }}
      INSIGHTS_SPREADSHEET_ID: ${{ vars.INSIGHTS_SPREADSHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      DOCS_MASTER_ID: ${{ vars.DOCS_MASTER_ID }}
      CHANNEL_DESCRIPTION_TEMPLATE: ${{ vars.CHANNEL_DESCRIPTION_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Backfill batch
        id: backfill
        run: npm run backfill-post-insights
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.SP_IG_GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.SP_IG_GOOGLE_DRIVE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.SP_YT_REFRESH_TOKEN }}
          SECRETS_WRITE_PAT: ${{ secrets.SECRETS_WRITE_PAT }}
      - name: Lanjut batch berikutnya
        if: steps.backfill.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run sp-yt-backfill.yml
