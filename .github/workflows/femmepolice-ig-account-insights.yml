name: Femmepolice IG - Account Insights
on:
  schedule:
    - cron: '0 4,9 * * *'
  workflow_dispatch:
concurrency:
  # Grup sendiri (bukan femmepolice-ig-insights) — snapshot akun nyentuh tab "* Account", beda
  # dari post-insights/backfill, jadi gak perlu antri di belakang mereka.
  group: femmepolice-ig-account
  cancel-in-progress: false
jobs:
  run:
    name: Femmepolice IG - Account Insights
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: femmepolice-instagram
    env:
      KALENDER_SPREADSHEET_ID: ${{ vars.KALENDER_SPREADSHEET_ID }}
      INSIGHTS_SPREADSHEET_ID: ${{ vars.INSIGHTS_SPREADSHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      DOCS_MASTER_ID: ${{ vars.DOCS_MASTER_ID }}
      FEMMEPOLICE_IG_BUSINESS_ACCOUNT_ID: ${{ vars.FEMMEPOLICE_IG_BUSINESS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run account-insights
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.SP_IG_GOOGLE_SERVICE_ACCOUNT_KEY }}
          FEMMEPOLICE_IG_ACCESS_TOKEN: ${{ secrets.FEMMEPOLICE_IG_ACCESS_TOKEN }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.SP_IG_GOOGLE_DRIVE_API_KEY }}
