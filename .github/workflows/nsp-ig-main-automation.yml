name: NSP IG - Main Automation
on:
  repository_dispatch:
    types: [run-nsp-main-automation]
  workflow_dispatch:
concurrency:
  group: nsp-ig-main-automation
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nsp-instagram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run main-automation
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.SP_IG_GOOGLE_SERVICE_ACCOUNT_KEY }}
          NSP_IG_ACCESS_TOKEN: ${{ secrets.NSP_IG_ACCESS_TOKEN }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.SP_IG_GOOGLE_DRIVE_API_KEY }}
