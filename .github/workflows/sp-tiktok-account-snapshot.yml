name: SP TikTok - Account Snapshot
on:
  schedule:
    # 2x sehari (06:00 & 18:00 UTC) — kalau satu run di-drop GitHub, run lain masih
    # nutup hari itu. Idempoten: nulis 1 baris per hari, run kedua cuma me-refresh.
    - cron: '0 6,18 * * *'
  workflow_dispatch:
concurrency:
  # Grup sendiri — jangan sampai ke-antri di belakang post-insights (yang cron-nya
  # juga 0 13) lalu ke-cancel waktu run terjadwal berikutnya masuk grup.
  group: sp-tiktok-account
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sp-tiktok
    permissions:
      contents: read
    env:
      KALENDER_SPREADSHEET_ID: ${{ vars.KALENDER_SPREADSHEET_ID }}
      INSIGHTS_SPREADSHEET_ID: ${{ vars.INSIGHTS_SPREADSHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      DOCS_MASTER_ID: ${{ vars.DOCS_MASTER_ID }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run account-snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.SP_IG_GOOGLE_SERVICE_ACCOUNT_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SECRETS_WRITE_PAT: ${{ secrets.SECRETS_WRITE_PAT }}
